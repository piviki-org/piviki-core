# Piviki host stack (AD-17, AD-21). The same file runs on every host, from the root-owned
# piviki-core checkout at /opt/piviki/core. Everything that differs between environments comes
# from the root-owned env files under /etc/piviki (env-manifest; each service reads only its
# own), and the core image tag from deploy.sh. Non-core images are pinned by digest, so a core
# commit names the whole host runtime. No service publishes a port: the only way in is the
# Cloudflare Tunnel, and Postgres is reachable only on an internal network.
name: piviki

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run"]
    env_file: /etc/piviki/cloudflared.env # TUNNEL_TOKEN
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    extra_hosts:
      # SSH ingress for the deploy user (ssh-<env>.piviki.fi) reaches the host's own sshd.
      - "host.docker.internal:host-gateway"
    networks: [edge]
    depends_on:
      caddy:
        condition: service_started

  caddy:
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    env_file: /etc/piviki/caddy.env # ADMIN_HOST, API_HOST, ADMIN_ORIGIN, PUBLIC_SCHEME
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /data
      - /config
    cap_drop: [ALL]
    # The image's caddy binary carries the file capability cap_net_bind_service; with it outside
    # the bounding set the kernel refuses to exec the binary at all. This is the only one added.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks: [edge, app]
    depends_on:
      core:
        condition: service_healthy

  core:
    image: ghcr.io/piviki-org/piviki-core:${CORE_TAG:?CORE_TAG is set by deploy.sh}
    env_file: /etc/piviki/core.env # DATABASE_URL, PAYLOAD_SECRET, SERVER_URL, CORS_ORIGINS, CSRF_ORIGINS
    environment:
      # From the host's /etc/piviki/environment, written by deploy.sh next to CORE_TAG; core
      # refuses to start when a host name disagrees with it (AD-17).
      ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT is set by deploy.sh}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/server/.next/cache:mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [app, db]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    env_file: /etc/piviki/postgres.env # POSTGRES_PASSWORD, PIVIKI_CORE_DB_PASSWORD
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    shm_size: 128mb
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d piviki"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [db]

networks:
  # cloudflared <-> caddy, and cloudflared's outbound connection to Cloudflare.
  edge: {}
  # caddy <-> core. Internal: core has no route to the internet or the instance metadata service.
  app:
    internal: true
  # core <-> postgres only.
  db:
    internal: true

volumes:
  pgdata: {}
