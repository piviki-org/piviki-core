version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      payload:
        patterns: ['payload', '@payloadcms/*']
      next-react:
        patterns: ['next', 'react', 'react-dom', '@types/react', '@types/react-dom']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # Host runtime images (AD-21): cloudflared, caddy, postgres, pinned by tag and digest.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
